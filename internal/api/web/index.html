      <button class="th rate" data-sort="rate" role="columnheader">Rate</button>
      <button class="th eta" role="columnheader">Time left</button>
      <button class="th segs" data-sort="segs" role="columnheader">Conn</button>
    </div>

    <div class="body" id="rows" role="rowgroup"></div>
  </div>

  <p class="empty" id="empty" hidden>No downloads yet. Press <kbd>+</kbd> to add one.</p>

  <footer class="statusbar">
    <span id="s-count">0 items</span>
    <span class="dot" aria-hidden="true"></span>
    <span id="s-active">Idle</span>
    <span class="flex"></span>
    <span id="s-speed">0 B/s</span>
  </footer>
</div>

<div class="scrim" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Add download</h2>

    <label class="field">
      <span>Address</span>
      <input id="m-url" type="url" spellcheck="false" autocomplete="off" placeholder="https://example.com/file.zip">
    </label>

    <label class="field">
      <span>Save as</span>
      <input id="m-name" type="text" spellcheck="false" autocomplete="off" placeholder="Automatic">
    </label>

    <label class="field">
      <span>Connections</span>
      <select id="m-seg">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8" selected>8</option>
        <option value="16">16</option>
        <option value="32">32</option>
      </select>
    </label>

    <!-- Options are filled from LIMITS in app.js, so the two speed menus can
         never drift apart in what they offer. -->
    <div class="field">
      <span>Speed limit</span>
      <select id="m-limit" class="wide"></select>
      <input id="m-limit-custom" class="custom" type="number" min="1" step="1"
             inputmode="numeric" placeholder="Kilobytes per second" hidden>
    </div>

    <p class="sheet-error" id="m-error" hidden></p>

    <div class="sheet-actions">
      <button class="tool" id="m-cancel" type="button">Cancel</button>
      <button class="tool primary" id="m-ok" type="button">Download</button>
    </div>
  </div>
</div>

<div class="scrim" id="limit" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="l-title">
    <h2 id="l-title">Speed limit</h2>
    <p class="sheet-note" id="l-who"></p>

    <div class="field">
      <span>Transfer speed</span>
      <select id="l-speed" class="wide"></select>
      <input id="l-speed-custom" class="custom" type="number" min="1" step="1"
             inputmode="numeric" placeholder="Kilobytes per second" hidden>
    </div>

    <p class="sheet-error" id="l-error" hidden></p>

    <div class="sheet-actions">
      <button class="tool" id="l-cancel" type="button">Cancel</button>
      <button class="tool primary" id="l-ok" type="button">Apply</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
